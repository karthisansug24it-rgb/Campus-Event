[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/.netlify/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://fxec-events-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://fxec-events-backend.onrender.com/uploads/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
