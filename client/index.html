<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Neutralize Netlify HUD badge injection at script source -->
    <script>
      (function() {
        const observer = new MutationObserver(function(mutations) {
          for (let i = 0; i < mutations.length; i++) {
            const added = mutations[i].addedNodes;
            for (let j = 0; j < added.length; j++) {
              const node = added[j];
              if (node.nodeType === 1) {
                if (node.tagName === 'SCRIPT' && (node.getAttribute('data-nf-variant') || (node.src && node.src.indexOf('netlify/scripts/hud') !== -1))) {
                  node.removeAttribute('data-nf-variant');
                  node.src = '';
                  node.remove();
                } else if (node.tagName === 'IFRAME' && (node.id === 'nl-badge-frame' || node.id === 'nl-hud-frame' || (node.id && node.id.indexOf('nl-') === 0))) {
                  node.remove();
                }
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        document.addEventListener('DOMContentLoaded', function() {
          const badges = document.querySelectorAll('script[data-nf-variant], script[src*="netlify/scripts/hud"], iframe#nl-badge-frame, iframe#nl-hud-frame, iframe[id^="nl-"]');
          badges.forEach(function(el) { el.remove(); });
        });
      })();
    </script>
    <link rel="icon" type="image/png" href="/fxec-logo.png" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#2563EB" />
    
    <!-- PWA & Chrome App Installation Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FXEC Events" />
    <meta name="application-name" content="FXEC Events" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta name="description" content="Francis Xavier Engineering College - Campus Event Management Portal for Hackathons, Workshops, and Conferences." />
    <title>FXEC Events | Francis Xavier Engineering College</title>
    
    <!-- Bespoke Editorial Typography: Merriweather paired with Source Sans 3 & Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <style>
      *, *::before, *::after, html, body, button, input, select, textarea, span, p, h1, h2, h3, h4, h5, h6, a, label, div, aside, nav, table, th, td, [class*="font-"] {
        font-family: 'Georgia', serif !important;
      }
    </style>

</html>
