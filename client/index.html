<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Neutralize Netlify HUD badge injection at script source -->
    <script>
      (function() {
        const observer = new MutationObserver(function(mutations) {
          for (let i = 0; i < mutations.length; i++) {
            const added = mutations[i].addedNodes;
            for (let j = 0; j < added.length; j++) {
              const node = added[j];
              if (node.nodeType === 1) {
                if (node.tagName === 'SCRIPT' && (node.getAttribute('data-nf-variant') || (node.src && node.src.indexOf('netlify/scripts/hud') !== -1))) {
                  node.removeAttribute('data-nf-variant');
                  node.src = '';
                  node.remove();
                } else if (node.tagName === 'IFRAME' && (node.id === 'nl-badge-frame' || node.id === 'nl-hud-frame' || (node.id && node.id.indexOf('nl-') === 0))) {
                  node.remove();
                }
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        document.addEventListener('DOMContentLoaded', function() {
          const badges = document.querySelectorAll('script[data-nf-variant], script[src*="netlify/scripts/hud"], iframe#nl-badge-frame, iframe#nl-hud-frame, iframe[id^="nl-"]');
          badges.forEach(function(el) { el.remove(); });
        });
      })();
    </script>
    <link rel="icon" type="image/png" href="/fxec-logo.png" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

      <style>
      *, *::before, *::after, html, body, button, input, select, textarea, span, p, h1, h2, h3, h4, h5, h6, a, label, div, aside, nav, table, th, td, [class*="font-"] {
        font-family: 'Georgia', serif !important;
      }
    </style>
  
    <style id="boot-animation-style">
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes bootBar {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(200%); }
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #FFFFFF !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: 'Georgia', serif;
      }
      #boot-splash img {
        background-color: #FFFFFF !important;
      }
    </style>

  <body class="bg-[#FAFBFC] text-slate-800 antialiased font-serif selection:bg-blue-700 selection:text-white" style="font-family: 'Georgia', serif;">
    <div id="root">
      <div id="boot-splash">
        <div style="position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <div style="position: absolute; inset: -12px; background: radial-gradient(circle, rgba(245,158,11,0.18) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; pointer-events: none;"></div>
          <div style="position: relative; width: 96px; height: 96px; border-radius: 50%; background-color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06); animation: bootPulse 2s infinite ease-in-out;">

          <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background-color: #2563EB; border-radius: 9999px; animation: bootBar 1.2s infinite ease-in-out;"></div>
